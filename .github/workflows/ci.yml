name: 237Boots CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify rebrand contract (layer 0 + GPL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        # L'amont est necessaire pour comparer les lignes de boot.
        fetch-depth: 0

    - name: Fetch upstream Ventoy
      run: git remote add upstream https://github.com/ventoy/Ventoy.git && git fetch upstream master

    - name: Verify layer 0, licence and brand
      run: python tools/verify_rebrand.py

  build:
    name: Build boot payload
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4

    - name: Run docker compose up
      run: docker compose up

    - name: List produced artifacts
      run: ls -la INSTALL/ && cat INSTALL/sha256.txt 2>/dev/null || true

    - uses: actions/upload-artifact@v4
      with:
        name: 237boots-windows
        path: INSTALL/ventoy-*windows*
        if-no-files-found: warn

    - uses: actions/upload-artifact@v4
      with:
        name: 237boots-linux
        path: INSTALL/ventoy-*linux*
        if-no-files-found: warn

    - uses: actions/upload-artifact@v4
      with:
        name: 237boots-livecd
        path: INSTALL/ventoy-*livecd*
        if-no-files-found: warn

    - uses: actions/upload-artifact@v4
      with:
        name: sha256sum
        path: INSTALL/sha256.txt
        if-no-files-found: warn

    - uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: DOC/build.log
        if-no-files-found: warn

  gui:
    name: Build 237Boots.exe (PyQt6)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 237Boots-GUI
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Verify the GUI imports and enumerates drives
      run: python selftest.py

    - name: Package the GUI
      run: python build.py

    - uses: actions/upload-artifact@v4
      with:
        name: 237boots-gui
        path: 237Boots-GUI/dist/237Boots-*/
        if-no-files-found: warn
